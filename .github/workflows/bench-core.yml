name: Benchmark Core
# On demand only. The push trigger named `master`, which is no longer the default
# branch, so it was already dead; re-aiming it at `main` would spend up to six
# hours of runner time per push on a job that has never been run here. Start one
# deliberately when a benchmark is the question being asked.
on:
  workflow_dispatch:

# Least privilege. This workflow only reads the repository; the token needs
# nothing else, and the repository default is `write`.
permissions:
  contents: read

jobs:
  bench_core_geth:
    name: Benchmark core-geth
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Benchmark ethereumclassic/core-geth
        id: bench
        run: |
          go test -short ./core -count 1 -p 1 -timeout 60m -run NONE -bench=. -v |& tee core-geth.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-geth
          path: ./core-geth.txt

  bench_go_ethereum:
    name: Benchmark go-ethereum
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: 'ethereum/go-ethereum'
          ref: 'v1.10.26'

      - name: Benchmark ethereum/go-ethereum
        id: bench
        run: |
          go test -short ./core -count 1 -p 1 -timeout 60m -run NONE -bench=. -v |& tee go-ethereum.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-ethereum
          path: ./go-ethereum.txt

  compare:
    name: Compare
    needs: [bench_core_geth, bench_go_ethereum]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Get dependencies
        run: |
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260825160852-19be9d8e6c70

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        name: Get go-ethereum artifact
        with:
          name: go-ethereum

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        name: Get core-geth artifact
        with:
          name: core-geth

      - name: "Analyze Results [COMPRESSED]"
        run: |
          benchstat go-ethereum.txt core-geth.txt

      - name: "Analyze Results [RAW DELTA]"
        run: |
          benchstat go-ethereum.txt core-geth.txt
