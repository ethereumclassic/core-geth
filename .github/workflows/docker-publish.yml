name: Publish Docker images

# Nothing in this repository published a container image before this workflow.
# `build/ci.go` carries the code to do it, inherited from upstream, and no CI
# configuration ever called it -- the previous namespace's images were built by
# a registry-side integration configured outside the source tree, which is why
# no fault was visible here.
#
# The registry is GHCR because it needs no account setup and no repository
# secret: GITHUB_TOKEN authenticates to it directly with `packages: write`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.variant.name }} ${{ matrix.platform.slug }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: core-geth
            dockerfile: Dockerfile
            prefix: ''
          - name: alltools
            dockerfile: Dockerfile.alltools
            prefix: 'alltools-'
        platform:
          # Each architecture builds on its own native runner. The images are
          # cgo builds, and compiling Go for arm64 under QEMU emulation takes
          # hours rather than minutes, so emulation is not a usable option here.
          - name: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout ethereumclassic/core-geth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The generated description is the repository's About text, which is not a
      # description of this image, and nothing names the vendor or the docs.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.description=${{ matrix.variant.prefix == '' && 'Core-Geth: the Ethereum Classic execution client' || 'Core-Geth: the Ethereum Classic execution client, with its developer tools' }}
            org.opencontainers.image.vendor=Ethereum Classic DAO LLC
            org.opencontainers.image.documentation=https://docs.coregeth.com

      # Pushed by digest only. The tags are applied once, in the merge job, to a
      # manifest list covering every architecture -- tagging here would leave the
      # last architecture to finish overwriting the others under the same tag.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILDNUM=${{ github.run_number }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      # The file name is the bare digest, with the algorithm prefix stripped:
      # the manifest step below re-adds `sha256:` when it rebuilds the
      # references, and leaving the prefix here produces `sha256:sha256:...`.
      - name: Record the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
        shell: bash

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant.name }}-${{ matrix.platform.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.variant.name }} manifest
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
      # Minting provenance needs an OIDC identity for the run and write access to
      # the attestation store. Neither is implied by `packages: write`.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: core-geth
            prefix: ''
          - name: alltools
            prefix: 'alltools-'

    steps:
      - name: Collect the per-architecture digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant.name }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:latest` is what a bare `docker pull` resolves to, so only a full
      # release may take it. A hyphen in the tag name is the semver marker for a
      # prerelease, so v1.13.0-rc1 publishes under its own name and v1.13.0
      # takes the moving tag. A manual run from a branch has no hyphen in its
      # name either, so the tag check comes first: without it a dispatch from
      # `main` would move `:latest` to an untagged build.
      #
      # This was `latest=auto`, which does NOT withhold the tag from a
      # prerelease: `auto` keys off `type=ref,event=tag` below, which has no
      # notion of one. Measured on the v0.0.0-pipeline-test run, where a build
      # named "pipeline-test" was published as `:latest`.
      - name: Derive the published tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            prefix=${{ matrix.variant.prefix }},onlatest=true
          # The trailing sha rule is always produced, including on a manual
          # run from a branch where none of the tag rules match. Without it a
          # dispatch run reaches the manifest step with no tag to apply and
          # fails there -- and that is exactly the run someone makes to test
          # this workflow before trusting it with a release.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `type=sha` carries its own default `prefix=sha-`, and a tag-level
            # prefix replaces the flavor-level one rather than composing with it.
            # Without restating the variant prefix here both manifest jobs write
            # the same `sha-<commit>` tag and whichever finishes last silently wins.
            type=sha,format=long,prefix=${{ matrix.variant.prefix }}sha-

      # GitHub shows a multi-arch image's description from the index annotations,
      # not from the per-architecture labels, so the index carries its own.
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          DESCRIPTION: "${{ matrix.variant.prefix == '' && 'Core-Geth: the Ethereum Classic execution client' || 'Core-Geth: the Ethereum Classic execution client, with its developer tools' }}"
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.vendor=Ethereum Classic DAO LLC" \
            --annotation "index:org.opencontainers.image.documentation=https://docs.coregeth.com" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository }}@sha256:%s ' *)
        shell: bash

      # Provenance binds to the index digest, which is what a pull resolves to.
      # Attesting one architecture's image would leave the manifest list -- the
      # thing users actually reference -- carrying nothing.
      - name: Capture the published index digest
        id: published
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        shell: bash

      # Gated on a tag for the same reason the archive attestation is: provenance
      # is written to a public append-only log, so a dispatch rehearsal that minted
      # one could not take it back.
      - name: Attest the published image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true

      # A green attestation step means the call returned, not that the result is
      # resolvable. Verifying by tag closes the one hop the step above cannot: that
      # the tag a user pulls still resolves to the digest the provenance names.
      # This runs here because the job already holds a registry credential --
      # checking it from a workstation needs a personal token minted for the
      # purpose, so in practice nobody would.
      - name: Verify the attestation resolves against the published tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify \
            "oci://${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
            --repo "${{ github.repository }}"
        shell: bash

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.version }}"
        shell: bash

  # Offline copies of the published images, for operators who cannot pull from the
  # registry. Each image is pulled back by its release tag after the manifest is
  # published and saved per architecture, so a loaded tarball's image ID is the
  # config digest a pull of that architecture returns. Nothing is rebuilt.
  tarballs:
    name: Save ${{ matrix.variant.name }} ${{ matrix.platform.slug }} image
    runs-on: ubuntu-24.04
    needs: [merge]
    # A dispatch run publishes no release tag to pull, and provenance cannot be
    # withdrawn once written, so this runs for tags only.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: core-geth
            prefix: ''
          - name: alltools
            prefix: 'alltools-'
        platform:
          - name: linux/amd64
            slug: amd64
          - name: linux/arm64
            slug: arm64

    steps:
      - name: Authenticate to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the published image
        id: save
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}:${{ matrix.variant.prefix }}${{ github.ref_name }}
          FILE: core-geth-${{ matrix.variant.prefix }}docker-${{ matrix.platform.slug }}-${{ github.ref_name }}.tar.gz
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform.name }}" "$IMAGE"
          arch=$(docker image inspect "$IMAGE" --format '{{.Architecture}}')
          if [ "$arch" != "${{ matrix.platform.slug }}" ]; then
            echo "pulled $arch, expected ${{ matrix.platform.slug }}"
            exit 1
          fi
          docker save "$IMAGE" | gzip > "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          echo "image ID $(docker image inspect "$IMAGE" --format '{{.Id}}')"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Attest the image tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.save.outputs.file }}

      - name: Keep the tarball for the release upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball-${{ matrix.variant.name }}-${{ matrix.platform.slug }}
          path: ${{ steps.save.outputs.file }}*
          if-no-files-found: error
          retention-days: 1

  # One job uploads every tarball, so parallel jobs do not race to create the
  # release. The draft is created by release-packages.yml from the same tag, and a
  # draft cannot be looked up by tag, so this waits for it by listing releases.
  release-tarballs:
    name: Attach the image tarballs to the release
    runs-on: ubuntu-24.04
    needs: [tarballs]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Collect the tarballs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: tarballs
          pattern: tarball-*
          merge-multiple: true

      - name: Upload to the draft release
        working-directory: tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Exactly one release may carry the tag. Taking the first of several put
          # the tarballs on a duplicate draft once, so more than one stops here.
          id=""
          for attempt in $(seq 1 60); do
            ids=$(gh api "repos/${{ github.repository }}/releases?per_page=30" \
              --jq '.[] | select(.tag_name == "${{ github.ref_name }}") | .id')
            if [ "$(printf '%s\n' "$ids" | grep -c .)" -gt 1 ]; then
              echo "more than one release carries ${{ github.ref_name }}: $(echo $ids)"
              exit 1
            fi
            id=$ids
            [ -n "$id" ] && break
            echo "waiting for the ${{ github.ref_name }} release ($attempt)"
            sleep 60
          done
          if [ -z "$id" ]; then
            echo "no release for ${{ github.ref_name }} after 60 minutes"
            exit 1
          fi
          count=0
          for f in core-geth-*docker-*.tar.gz core-geth-*docker-*.tar.gz.sha256; do
            gh api -X POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$f" \
              --input "$f" > /dev/null
            echo "uploaded $f"
            count=$((count + 1))
          done
          if [ "$count" -ne 8 ]; then
            echo "uploaded $count files, expected 8"
            exit 1
          fi
        shell: bash
