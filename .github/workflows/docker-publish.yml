name: Publish Docker images

# Nothing in this repository published a container image before this workflow.
# `build/ci.go` carries the code to do it, inherited from upstream, and no CI
# configuration ever called it -- the previous namespace's images were built by
# a registry-side integration configured outside the source tree, which is why
# no fault was visible here.
#
# The registry is GHCR because it needs no account setup and no repository
# secret: GITHUB_TOKEN authenticates to it directly with `packages: write`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.variant.name }} ${{ matrix.platform.slug }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: core-geth
            dockerfile: Dockerfile
            prefix: ''
          - name: alltools
            dockerfile: Dockerfile.alltools
            prefix: 'alltools-'
        platform:
          # Each architecture builds on its own native runner. The images are
          # cgo builds, and compiling Go for arm64 under QEMU emulation takes
          # hours rather than minutes, so emulation is not a usable option here.
          - name: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64

    steps:
      - name: Checkout ethereumclassic/core-geth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}

      # Pushed by digest only. The tags are applied once, in the merge job, to a
      # manifest list covering every architecture -- tagging here would leave the
      # last architecture to finish overwriting the others under the same tag.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
            BUILDNUM=${{ github.run_number }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      # The file name is the bare digest, with the algorithm prefix stripped:
      # the manifest step below re-adds `sha256:` when it rebuilds the
      # references, and leaving the prefix here produces `sha256:sha256:...`.
      - name: Record the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.push.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
        shell: bash

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.variant.name }}-${{ matrix.platform.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.variant.name }} manifest
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: core-geth
            prefix: ''
          - name: alltools
            prefix: 'alltools-'

    steps:
      - name: Collect the per-architecture digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant.name }}-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest=auto` withholds the moving tag from a prerelease, so a tag such
      # as v1.13.0-rc1 publishes under its own name without becoming what an
      # untagged pull resolves to.
      - name: Derive the published tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=auto
            prefix=${{ matrix.variant.prefix }},onlatest=true
          # The trailing sha rule is always produced, including on a manual
          # run from a branch where none of the tag rules match. Without it a
          # dispatch run reaches the manifest step with no tag to apply and
          # fails there -- and that is exactly the run someone makes to test
          # this workflow before trusting it with a release.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository }}@sha256:%s ' *)
        shell: bash

      - name: Show what was published
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.version }}"
        shell: bash
