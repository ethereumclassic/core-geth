name: EVMC

# These follow the default branch. The ruleset protecting it requires this
# job's "EVMC/EVM+EWASM State Tests" check, so a workflow scoped to a branch
# that is no longer the default cannot report it and every pull request
# deadlocks -- including the one that would fix the scoping.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege. This workflow only reads the repository; the token needs
# nothing else, and the repository default is `write`.
permissions:
  contents: read

jobs:

  build-evmc:
    name: EVMC/EVM+EWASM State Tests
    runs-on: ubuntu-24.04
    steps:

      - name: Set up Go 1.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cmake
        run: |
          sudo apt-get update -y
          sudo apt-get upgrade -y
          sudo apt-get install -y cmake
          cmake --version

      - name: Get dependencies
        run: |
          go get -v -t -d ./...
          git config --global --add safe.directory $(pwd)/tests/evm-benchmarks
          git config --global --add safe.directory $(pwd)/tests/testdata
          git config --global --add safe.directory $(pwd)/tests/testdata/LegacyTests
          git submodule update --init --recursive
          export GOBIN=${HOME}/go/bin
          mkdir -p "${GOBIN}"
          export PATH="${PATH}:${GOBIN}"
          go install -x golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          gomobile init

      - name: Test EVMC
        run: |
          make test-evmc
