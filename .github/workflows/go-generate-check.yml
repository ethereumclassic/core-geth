name: Developer helper
on:
  pull_request:
  workflow_dispatch:
env:
  # GENERATE_EXCEPTIONS are exceptions made to the 'go generate' command.
  # These patterns are matched (negatively) against 'go list' output.
  #
  # - trezor: Ignore generating trezor package based on this comment:
  #   https://github.com/ethereum/go-ethereum/blob/master/accounts/usbwallet/trezor/trezor.go#L21-L43
  GENERATE_EXCEPTIONS: |
    trezor
# Least privilege. This workflow only reads the repository; the token needs
# nothing else, and the repository default is `write`.
permissions:
  contents: read

jobs:
  go-generate-check:
    name: Check if "go generate" has been run
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Go 1.x
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26'
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install devtools
        id: install-devtools
        run: make devtools
      - name: Revert custom generated files modifications before comparing them
        id: revert-custom-generated-modifications
        run: |
          # NOTE to developers checking what triggered this alert.
          # This script is meant to alert you if some files have to be regenerated using `go generate`.
          # If this happens, you have to run `go generate ./...` and then check the below commits that are being reverted and reapply them, after considering if they are needed.

          git config user.name github-actions
          git config user.email github-actions@github.com

          # Intentionally revert this commit which has a custom modification to the genesis unmarshaling,
          # with regards reading different genesis formats origniating from different clients
          # This way, this script can alert us on any code changes that have to be applied on if file gets changed.
          # This commit implements genesis JSON unmarshaling for supported data types.
          git revert --no-edit db245033d654c18d5fd82ca7050dc2d72d2d6d0a

      # `go list` prints one package per line, and `go generate "$list"` passed all of them as a
      # single argument: `malformed import path ... invalid char '\n'`, exit 1. So this step never
      # ran a generator, and the two checks below it never ran at all. `xargs` passes them as
      # separate arguments, which is what was meant. It runs after the revert above so that the
      # revert cannot be mistaken for generated drift.
      - name: Run go:generate
        id: go-generate
        run: |
          list="$(go list ./...)"
          for pattern in ${GENERATE_EXCEPTIONS[@]}; do
            list="$(grep -v "$pattern" <<< "$list")"
          done
          # An empty list would make `xargs` run `go generate` with no arguments, which generates the
          # root package only, finds no directives and exits 0: a pass that checked nothing. Fail instead.
          if [ -z "$list" ]; then
            echo "🔴 ERROR: the package list is empty, so nothing would be generated"
            exit 1
          fi
          xargs go generate <<< "$list"
      - name: Check for modified files
        id: git-check
        run: |
          git update-index --refresh > /dev/null || true
          if ! git diff-index --quiet HEAD --; then
            echo "🔴 ERROR: There are modified files after running 'go generate'"
            git status
            exit 1
          fi

      # go-ethereum verifies `go generate` and `go mod tidy` together in its
      # ci.go check_generate. The generate half is the job above, which is
      # deliberately fork-specific. This is the tidy half: a manifest that does
      # not survive `go mod tidy` drifts silently, and nothing else here would
      # notice until the next dependency change made it look like that change's
      # fault.
      - name: Check that go mod tidy produces no changes
        id: tidy-check
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "🔴 ERROR: 'go mod tidy' modified go.mod or go.sum"
            git --no-pager diff --stat go.mod go.sum
            exit 1
          fi
