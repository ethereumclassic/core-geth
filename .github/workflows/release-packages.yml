name: Build packages for a release

on:
  push:
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

# Least privilege. Only the publish job writes: action-gh-release creates the
# draft release there, which needs contents:write.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    name: Build artifacts
    runs-on: ${{ matrix.os }}
    # Scoped on the job rather than widening the workflow default. The two extra
    # scopes exist only to mint and record a build attestation.
    permissions:
      contents: read      # check out the source
      id-token: write     # short-lived Sigstore certificate; no key is stored
      attestations: write # record the provenance attestation
    strategy:
      matrix:
        include:
        # `osx` keeps the architecture every previous release shipped, so an
        # existing download path does not silently change what it returns.
        # Apple Silicon is published beside it under its own name rather than
        # replacing it: `macos-latest` now resolves to an Arm64 image, so
        # building there under the old name would have handed Intel users a
        # binary their machine cannot run.
        - os: macos-26-intel
          BUILD_OS_NAME: osx

        - os: macos-26
          BUILD_OS_NAME: osx-arm64

        - os: ubuntu-24.04
          BUILD_OS_NAME: linux

        - os: ubuntu-24.04
          BUILD_OS_NAME: arm

        - os: windows-2025
          BUILD_OS_NAME: win64

    steps:
      - name: Checkout ethereumclassic/core-geth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One Go patch for every leg. A bare `1.26` takes whichever patch each runner
      # image carries: RC4 shipped 1.26.8 from most runners, 1.26.7 from the Intel
      # macOS one, and 1.26.6 on the ARM legs, whose `-dlgo` reads the version
      # pinned in build/checksums.txt. Keep this and that pin on the same patch.
      - name: Set up Go 1.x
        if: ${{ matrix.BUILD_OS_NAME != 'arm' }}
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'

      - name: Cache lookup (Linux/ARM)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ matrix.BUILD_OS_NAME == 'linux' || matrix.BUILD_OS_NAME == 'arm'}}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ matrix.BUILD_OS_NAME }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.BUILD_OS_NAME }}-go-

      - name: Cache lookup (MacOS)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ startsWith(matrix.BUILD_OS_NAME, 'osx') }}
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ matrix.BUILD_OS_NAME }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.BUILD_OS_NAME }}-go-

      - name: Cache lookup (Windows)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ matrix.BUILD_OS_NAME == 'win64'}}
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ matrix.BUILD_OS_NAME }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ matrix.BUILD_OS_NAME }}-go-

      # The Linux release archives take their glibc floor from whatever compiler
      # builds them. Taking it from the runner image made the artifact's minimum
      # supported distribution a property of an image nobody chose; see the
      # rationale with the pin in build/checksums.txt.
      - name: Install the pinned C toolchain (Linux and ARM)
        if: ${{ matrix.BUILD_OS_NAME == 'linux' || matrix.BUILD_OS_NAME == 'arm' }}
        run: |
          set -euo pipefail
          version=$(awk '/^# version:zig /{print $3}' build/checksums.txt)
          file="zig-x86_64-linux-${version}.tar.xz"
          want=$(awk -v f="$file" '$2 == f {print $1}' build/checksums.txt)
          if [ -z "$version" ] || [ -z "$want" ]; then
            echo "no zig pin found in build/checksums.txt"
            exit 1
          fi
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://ziglang.org/download/${version}/${file}"
          got=$(sha256sum < "$RUNNER_TEMP/$file" | cut -d' ' -f1)
          if [ "$got" != "$want" ]; then
            echo "zig checksum mismatch for $file"
            echo "  want $want"
            echo "  got  $got"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/zig" --strip-components=1
          "$RUNNER_TEMP/zig/zig" version

      - name: Build all packages (Linux)
        if: ${{ matrix.BUILD_OS_NAME == 'linux' }}
        env:
          CC: ${{ runner.temp }}/zig/zig cc -target x86_64-linux-gnu.2.31
          # zig writes its cache beside the sources it compiles, and the Go module
          # cache is read-only, so the cgo build of a vendored C dependency fails
          # with AccessDenied unless both cache directories are redirected.
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache-global
        run: make all

      - name: Verify the Linux glibc floor
        if: ${{ matrix.BUILD_OS_NAME == 'linux' }}
        run: |
          set -euo pipefail
          floor=$(objdump -T build/bin/geth | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "glibc floor: $floor"
          # Fail the release rather than publish an archive that will not start
          # on a system it should. 2.31 is the floor this build asks the toolchain
          # for, so anything above it means the targeting did not take effect. The
          # published v1.12.x binaries measured 2.34 despite naming a 2.31 build
          # image, which is the drift this check exists to catch.
          highest=$(printf '%s\n%s\n' "${floor#GLIBC_}" "2.31" | sort -V | tail -1)
          if [ "$highest" != "2.31" ]; then
            echo "floor $floor exceeds the 2.31 supported by the previous release"
            exit 1
          fi
          if objdump -T build/bin/geth | grep -q '__isoc23_'; then
            echo "__isoc23_* symbols present; the C23 redirections are back"
            exit 1
          fi

      # Without a deployment target the toolchain stamps the runner's own macOS
      # version as the binaries' minimum: RC4 declared macOS 26.0. 12.0 is the
      # oldest macOS Go 1.26 runs on. Windows toolchains ignore the variable.
      - name: Build all packages (macOS, Windows)
        if: ${{ matrix.BUILD_OS_NAME != 'arm' && matrix.BUILD_OS_NAME != 'linux' }}
        id: build-non-arm-images
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.BUILD_OS_NAME, 'osx') && '12.0' || '' }}
        run: make all

      - name: Verify the macOS minimum version
        if: ${{ startsWith(matrix.BUILD_OS_NAME, 'osx') }}
        run: |
          set -euo pipefail
          for bin in build/bin/*; do
            minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/ {found=1} found && $1 == "minos" {print $2; exit}')
            echo "$bin: minimum macOS $minos"
            if [ "$minos" != "12.0" ]; then
              echo "$bin declares macOS $minos as its minimum, not the 12.0 this release targets"
              exit 1
            fi
          done

      # The Windows executables carry version information and a manifest that
      # build/ci.go generates. Read it back through Windows itself, so a release
      # cannot ship with the details empty.
      - name: Verify the Windows version information
        if: ${{ matrix.BUILD_OS_NAME == 'win64' }}
        shell: pwsh
        run: |
          foreach ($exe in Get-ChildItem build/bin/*.exe) {
            $info = $exe.VersionInfo
            "{0}: {1}, {2} {3}, {4}" -f $exe.Name, $info.CompanyName, $info.ProductName, $info.ProductVersion, $info.FileDescription
            if ($info.CompanyName -ne 'Ethereum Classic DAO LLC' -or $info.ProductName -ne 'Core-Geth' -or -not $info.ProductVersion -or $info.OriginalFilename -ne $exe.Name) {
              Write-Error "$($exe.Name) is missing its version information"
              exit 1
            }
          }

      - name: Build all packages (ARM)
        id: build-arm-images
        if: ${{ matrix.BUILD_OS_NAME == 'arm' }}
        env:
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-cache
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-cache-global
        run: |
          set -euo pipefail
          ZIG="$RUNNER_TEMP/zig/zig"

          # Each target names the glibc it links against, for the same reason the
          # Linux leg does. Taken from the build image instead, every Arm floor
          # moved to 2.34 between v1.12.20 and v1.12.21 -- from 2.28 on the 32-bit
          # targets and from 2.17 on arm64. The values below are what v1.12.20
          # shipped. The pinned toolchain also replaces the six cross-compiler
          # packages this step used to install from the build image.
          check_floor() {
            want=$1; label=$2
            got=$(objdump -T build/bin/geth | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            highest=$(printf '%s\n%s\n' "${got#GLIBC_}" "$want" | sort -V | tail -1)
            if [ "$highest" != "$want" ]; then
              echo "$label: glibc floor $got exceeds the $want this target is built for"
              exit 1
            fi
            echo "$label: glibc floor $got"
          }

          echo "arm: This archive name is deprecated and is byte-identical to"
          echo "     the arm5 archive built from the same GOARM=5 invocation."
          echo "     Use the arm5 archive; this name is kept only so an existing"
          echo "     download path does not break, and will not be kept forever."
          GOARM=5 go run build/ci.go install -dlgo -arch arm -cc "$ZIG cc -target arm-linux-gnueabi.2.28"
          check_floor 2.28 arm
          env BUILD_OS_NAME=arm ./build/archive-signing.sh

          GOARM=5 go run build/ci.go install -dlgo -arch arm -cc "$ZIG cc -target arm-linux-gnueabi.2.28"
          check_floor 2.28 arm5
          env BUILD_OS_NAME=arm5 ./build/archive-signing.sh
          GOARM=6 go run build/ci.go install -dlgo -arch arm -cc "$ZIG cc -target arm-linux-gnueabi.2.28"
          check_floor 2.28 arm6
          env BUILD_OS_NAME=arm6 ./build/archive-signing.sh
          GOARM=7 go run build/ci.go install -dlgo -arch arm -cc "$ZIG cc -target arm-linux-gnueabihf.2.28"
          check_floor 2.28 arm7
          env BUILD_OS_NAME=arm7 ./build/archive-signing.sh
          go run build/ci.go install -dlgo -arch arm64 -cc "$ZIG cc -target aarch64-linux-gnu.2.17"
          check_floor 2.17 arm64
          env BUILD_OS_NAME=arm64 ./build/archive-signing.sh

      - name: Print Core-Geth version (Linux/MacOS)
        if: ${{ matrix.BUILD_OS_NAME == 'linux' || startsWith(matrix.BUILD_OS_NAME, 'osx') }}
        run: ./build/bin/geth version

      - name: Print Core-Geth version (Windows)
        if: ${{ matrix.BUILD_OS_NAME == 'win64' }}
        run: ./build/bin/geth.exe version

      - name: Prepare archives for release
        if: ${{ matrix.BUILD_OS_NAME != 'arm' }}
        run: ./build/archive-signing.sh
        env:
          BUILD_OS_NAME: ${{ matrix.BUILD_OS_NAME }}

      # The two steps below publish; everything above only builds. They are
      # therefore gated on a tag, which makes workflow_dispatch a rehearsal: the
      # toolchain, the cross-compiles and both floor gates run, and nothing is
      # released or recorded.
      #
      # The attestation gate is the load-bearing one. Provenance is written to a
      # public append-only transparency log, so a dispatch run that minted one
      # could not take it back — there is no such thing as a practice attestation.

      # Before the upload, so a failed attestation stops publication. Provenance
      # is bound to the run that produced the archive and cannot be added after
      # the fact, unlike a detached signature.
      - name: Attest the release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: core-geth*.zip

      # The archives go to the publish job rather than to the release. Each build
      # leg creating the draft itself raced: two legs that reached the upload
      # before any draft existed each created one, and the release was split
      # across two drafts. Runs on a rehearsal too, so a rehearsal tests it.
      - name: Keep the archives for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives-${{ matrix.BUILD_OS_NAME }}
          path: core-geth*.zip*
          if-no-files-found: error
          compression-level: 0 # the archives are already compressed
          retention-days: 1

  publish:
    name: Upload the release assets
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # The only job that writes to the release, in a single call, so exactly one
    # draft exists and it receives every archive or none.
    permissions:
      contents: write
    steps:
      - name: Collect the archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-archives-*
          merge-multiple: true

      # 9 platforms, each a geth and an alltools archive with its checksum.
      - name: Check every archive arrived
        run: |
          set -euo pipefail
          archives=$(ls core-geth*.zip | wc -l)
          checksums=$(ls core-geth*.zip.sha256 | wc -l)
          echo "$archives archives, $checksums checksums"
          if [ "$archives" -ne 18 ] || [ "$checksums" -ne 18 ]; then
            echo "expected 18 archives and 18 checksums"
            exit 1
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          # A hyphen in the tag is the semver marker for a prerelease. Without
          # this a release candidate publishes looking like a finished release,
          # which is what an operator scanning the releases page acts on.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: core-geth*.zip*
