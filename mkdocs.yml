# Project information
site_name: Core-Geth Documentation
site_description: "Documentation for Core-Geth, the Ethereum Classic execution client: install, run and operate an ETC or Mordor node, and the security audits behind each release."
site_url: https://docs.coregeth.com/
site_author: Core-Geth Team

# Repository
repo_name: ethereumclassic/core-geth
repo_url: https://github.com/ethereumclassic/core-geth
edit_uri: edit/main/docs/

