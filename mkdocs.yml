# Configuration
# Explicit navigation. Without it mkdocs derives the menu from the file tree,
# which buries the upgrade path a v1.12.x operator is here to find among the
# tutorials. Ordered by what a reader needs first: install, run, upgrade.
nav:
  - Home: index.md
  - Node operators: operators.md
  - About:
      - Project history: about/project-history.md
      - Questions and answers: about/faq.md
      - ETC Cooperative transition: etc-cooperative-transition.md
      - Support this work: support.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Hardware requirements: getting-started/hardware-requirements.md
      - Running a node:
          - Overview: getting-started/run-a-node.md
          - Linux users guide: getting-started/run/linux.md
          - Mac users guide: getting-started/run/macos.md
          - Windows users guide: getting-started/run/windows.md
          - Docker users guide: getting-started/run/docker.md
          - Run an Ethereum Classic node: getting-started/run-classic-node.md
          - Run a Mordor node: getting-started/run-mordor-node.md
      - Command line: getting-started/run-cli.md
  - Upgrading to v1.13.0:
      - Overview: tutorials/v1.13.0-migration.md
      - Linux users guide: tutorials/migration/linux.md
      - Mac users guide: tutorials/migration/macos.md
      - Windows users guide: tutorials/migration/windows.md
      - Docker users guide: tutorials/migration/docker.md
  - Operate:
      - Sync modes and data retention: operate/sync-modes.md
      - Security and network exposure: operate/security.md
      - MESS: operate/mess.md
      - Maintenance, backup and upgrades: operate/maintenance.md
      - Troubleshooting: operate/troubleshooting.md
      - Monitoring: operate/monitoring.md
  - Guides:
      - Choose your role: guides/index.md
      - Production operations: guides/production-operations.md
      - Public RPC endpoint: guides/public-rpc-endpoint.md
      - Archive node: guides/archive-node.md
      - Mining: guides/mining.md
      - Mining pool node: guides/mining-pool-node.md
      - Mine on Mordor: guides/mordor-mining.md
      - Bootnodes and peer discovery: guides/bootnodes-and-discovery.md
      - MESS confirmation calculator: guides/mess-calculator.md
      - Private network: tutorials/private-network.md
      - Add a network: developers/add-network.md
  - Build and develop:
      - Build from source: developers/build-from-source.md
      - Testing: developers/testing.md
      - Versioning: developers/versioning.md
      - Documentation: developers/documentation.md
      - Cutting a release: developers/create-new-release.md
  - Tools:
      - Overview: core/index.md
      - All tools: core/alltools.md
      - EVMC: core/evmc.md
  - JSON-RPC API:
      - Overview: JSON-RPC-API/index.md
      - OpenRPC discovery: JSON-RPC-API/openrpc.md
      - eth: JSON-RPC-API/modules/eth.md
      - net: JSON-RPC-API/modules/net.md
      - web3: JSON-RPC-API/modules/web3.md
      - admin: JSON-RPC-API/modules/admin.md
      - debug: JSON-RPC-API/modules/debug.md
      - miner: JSON-RPC-API/modules/miner.md
      - txpool: JSON-RPC-API/modules/txpool.md
      - personal: JSON-RPC-API/modules/personal.md
      - ethash: JSON-RPC-API/modules/ethash.md
      - trace: JSON-RPC-API/modules/trace.md
      - trace overview: JSON-RPC-API/trace-module-overview.md
  - Audits and reports:
      - v1.13.0 release report: release-reports/v1.13.0.md
      - v1.13.0 record: release-reports/v1.13.0-record.md
      - March 2026 security audit: audits/2026-03-security-audit.md
      - August 2026 security follow-up: audits/2026-08-security-followup.md
      - Dependency and toolchain modernization: audits/2026-08-dependency-modernization.md
      - Release artifacts: audits/2026-09-release-pipeline.md
      - Go toolchain: audits/2026-09-go-toolchain.md
      - 2021 chain split postmortem: postmortems/2021-08-22-split-postmortem.md


theme:
  # https://github.com/squidfunk/mkdocs-material/tree/master/src
  name: material
  # overrides/main.html adds the link preview metadata the theme does not emit.
  custom_dir: overrides
  logo: img/logo.svg
  favicon: img/favicon.png
  language: en

  palette:
    scheme: slate
    primary: black
    accent: green

  icon:
    repo: fontawesome/brands/github

  # Don't include MkDocs' JavaScript
  include_search_page: false

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.sections
    # - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

extra_css:
  - assets/css/extra.css
extra_javascript:
  - assets/js/mess-calculator.js

use_directory_urls: true

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      type: timeago

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite
  - def_list
  - footnotes
  # - meta
  - smarty
  - toc:
      permalink: true
  - pymdownx.emoji
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      social_url_shorthand: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      linenums: true
